# GUIv2's firmware-owned WASM files remain on the read-only root filesystem.
# VPM publishes only the active package's mutable bootstrap descriptor and
# assets from its application-owned data directory.
location = /gui-v2/branding.json {
    alias /data/venus-package-manager/www/gui-v2/branding.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}

location ^~ /gui-v2/partners/ {
    alias /data/venus-package-manager/www/gui-v2/partners/;
    add_header Cache-Control "no-cache";
}
