[storage]
driver = "overlay"

# All podman-managed state - pulled images, container layers, the overlay
# filesystem - lives under the "container" user's persistent home on /data.
# Kept separate from any bind-mounted application data (e.g. a container's
# own config/state volumes), which belongs under
# /data/home/container/data instead.
#
# This has to be the container user's own $HOME/.config/containers/
# storage.conf (see the volatiles fragment that seeds it from here) -
# rootless podman does not read graphroot from the system-wide
# /etc/containers/storage.conf.
graphroot = "/data/home/container/storage"
