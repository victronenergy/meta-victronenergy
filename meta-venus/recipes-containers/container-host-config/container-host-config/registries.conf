# System-wide container registry configuration (v2 format).
# See containers-registries.conf(5) for documentation.
#
# Overrides meta-virtualization's own container-host-config recipe,
# which still ships the legacy v1 schema
# ([registries.search]/[registries.insecure]/[registries.block]) on the
# scarthgap branch this layer is pinned to. Current podman/skopeo (6.1.0)
# refuses to load a v1-format file at all ("registries.conf must be in
# v2 format but is in v1") - confirmed live on a fresh raspberrypi5 test
# device (2026-09-01): every image pull failed outright until this was
# replaced. Same registry list as the upstream v1 file, just in the
# schema current podman actually accepts.

unqualified-search-registries = ["docker.io", "registry.fedoraproject.org", "quay.io", "registry.access.redhat.com"]
